<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Standardize</title>
<script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
<style>
  :root{--blue:#0079C1;--blue-dark:#00629B;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#aeaeb2;
        --line:#e8e8ed;--bg:#fafafa;--card:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
            font-size:13px;color:var(--ink);display:flex;flex-direction:column;background:var(--bg);
            -webkit-font-smoothing:antialiased}
  .label{font-size:11px;color:var(--ink2);margin:14px 12px 6px;font-weight:600;
         text-transform:uppercase;letter-spacing:.04em}
  #list{margin:0 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 12px}
  .item{font-size:12px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--ink2)}
  .item:last-child{border-bottom:0}
  .item b{color:var(--ink);font-weight:600}
  .hint{font-size:11px;color:var(--ink3);margin:8px 12px}
  #out{flex:1;overflow-y:auto;padding:12px}
  .sys{color:var(--ink3);font-size:11px;text-align:center;margin:8px 0}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:10px;
       padding:9px 11px;font-size:12px;line-height:1.45}
  .foot{border-top:1px solid var(--line);padding:10px 12px;background:var(--card)}
  .send{width:100%;padding:8px;cursor:pointer;border:0;border-radius:980px;
        background:var(--blue);color:#fff;font:inherit;font-size:13px;font-weight:500}
  .send:hover{background:var(--blue-dark)}
  .send:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
  <div class="label">Document standard</div>
  <div id="list"><div class="item">Loading standard…</div></div>
  <div class="hint">Governed by administrators on the AI&nbsp;Analysis page. The previous state stays in version history.</div>
  <div id="out"></div>
  <div class="foot">
    <button class="send" id="apply">Apply standard</button>
  </div>
<script src="code.js"></script>
</body>
</html>
